apiVersion: 1

providers:
  - name: 'itp'
    orgId: 1
    folder: 'ITP'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards-json/itp

  - name: 'aprxm'
    orgId: 1
    folder: 'APRXM'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards-json/aprxm
