apiVersion: 1

groups:
  - orgId: 1
    name: itp-alertas-criticos
    folder: ITP
    interval: 1m
    rules:
      - uid: itp-alerta-site-fora-do-ar
        title: Site ou API fora do ar
        condition: C
        for: 2m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Um dos domínios públicos (site, API ou sistema ITP) parou de responder."
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: probe_success
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-disco-cheio
        title: Disco quase cheio (acima de 90%)
        condition: C
        for: 5m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "O disco principal da VM está acima de 90% de uso — risco de parada por falta de espaço."
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-memoria-critica
        title: Memória disponível crítica (abaixo de 10%)
        condition: C
        for: 5m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Memória disponível da VM está abaixo de 10% — risco real de o sistema matar processos (OOM killer)."
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [10] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-container-caido
        title: Um serviço (container) parou de responder
        condition: C
        for: 2m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "Um dos serviços Docker parou de reportar métricas há mais de 5 minutos — provavelmente caiu ou está reiniciando em loop."
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: max by (name) (time() - container_last_seen{name!=""})
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                # Achado real 2026-09-14: threshold de 120s + "for: 2m" (total
                # ~4min) disparava em TODO redeploy normal (docker compose build
                # + up -d --force-recreate) de qualquer app, gerando 8+ emails
                # de falso alarme num unico dia de trabalho -- container_last_seen
                # do cAdvisor demora mais que 2min pra "esquecer" um container
                # recriado em alguns casos (rebuild de imagem incluido). Subido
                # pra 300s (~7min total com o "for") -- ainda rapido o bastante
                # pra pegar crash-loop/queda real, mas tolera deploy manual sem
                # spam.
                - evaluator: { type: gt, params: [300] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-taxa-erro-http
        title: Muitos erros de usuário em pouco tempo (5xx)
        condition: C
        for: 3m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "Mais de 20% das requisições HTTP nos últimos 5 minutos estão retornando erro de servidor (5xx)."
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) or vector(0)) / (sum(rate(http_requests_total[5m])) or vector(1)) * 100
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-coletor-erros-parado
        title: Coletor de erros (catálogo) sem execução recente
        condition: C
        for: 1m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O coletor de erros (catalogo-erros-coletor, cron de 5 em 5 min) não teve nenhuma execução registrada há mais de 15 minutos — pode estar travando antes de gravar o heartbeat, ou o cron parou de disparar. Achado real 2026-09-14: até esta métrica existir, o único jeito de saber que o coletor tinha travado (40 falhas seguidas) era ele mesmo se auto-diagnosticar numa execução futura bem-sucedida — sem heartbeat externo, uma falha permanente passaria despercebida."
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: time() - tarefa_ultima_execucao_timestamp_seconds{tarefa="catalogo-erros-coletor"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [900] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C
